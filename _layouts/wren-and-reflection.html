<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.first_name }} {{ site.last_name }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}"
    >
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/wren-and-reflection.css' | relative_url }}">
  </head>
  <body>
    <main class="landing-shell">
      <section class="landing-card" aria-labelledby="landing-title">
        {% if page.eyebrow %}
          <p class="eyebrow">{{ page.eyebrow }}</p>
        {% endif %}

        <h1 id="landing-title">{{ page.title }}</h1>

        {% if page.description %}
          <p class="dek">{{ page.description }}</p>
        {% endif %}

        <div class="landing-content">
          {{ content }}
        </div>
      </section>
    </main>
  </body>
</html>
